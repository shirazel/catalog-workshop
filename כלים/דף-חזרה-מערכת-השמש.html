<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דף חזרה: מערכת השמש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --lm-blue:#0181C9; --lm-blue-deep:#0B4F7C; --lm-teal:#6BE3D1; --lm-teal-soft:#E6FAF6;
    --lm-yellow:#E5E633; --lm-orange:#FA7548; --lm-ink:#303030; --lm-body:#4A4A4A; --lm-muted:#6B6B6B;
    --lm-border:#DDE7E8; --ok:#1E8449; --ok-soft:#E8F6EE; --bad:#B03A2E; --bad-soft:#FBEDEB;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#fff; color:var(--lm-body); font-family:'Assistant','Heebo',sans-serif; font-size:18px; line-height:1.7; }
  .hero{ background:var(--lm-teal); padding:46px 16px 70px; text-align:center; }
  .hero small{ display:inline-block; font-weight:700; color:var(--lm-blue-deep); letter-spacing:.04em; margin-bottom:6px; }
  .hero h1{ margin:0; font-size:44px; line-height:1.15; font-weight:800; color:var(--lm-ink); }
  .hero h1 .mark{ background:linear-gradient(transparent 58%, var(--lm-yellow) 58%); padding:0 4px; }
  .hero p{ margin:12px auto 0; max-width:560px; color:var(--lm-ink); }
  main{ max-width:760px; margin:-40px auto 60px; padding:0 16px; }
  .card{ background:#fff; border-radius:18px; box-shadow:0 10px 30px rgba(11,79,124,.12); padding:26px 28px; margin-bottom:20px; }
  .card h2{ margin:0 0 4px; font-size:22px; color:var(--lm-blue-deep); font-weight:700; }
  .card .num{ font-weight:800; color:var(--lm-blue); font-size:15px; letter-spacing:.06em; }
  .card .q{ font-size:21px; font-weight:700; color:var(--lm-ink); margin:4px 0 14px; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row label{ flex:1 1 220px; }
  label.f{ display:block; font-weight:600; color:var(--lm-ink); margin-bottom:6px; }
  input[type=text], textarea{ width:100%; font:inherit; padding:12px 14px; border:1.5px solid var(--lm-border); border-radius:12px; background:#fff; color:var(--lm-ink); }
  textarea{ min-height:96px; resize:vertical; }
  input[type=text]:focus, textarea:focus{ outline:none; border-color:var(--lm-blue); }
  .opts{ display:grid; gap:10px; }
  .opt{ display:flex; gap:12px; align-items:center; border:1.5px solid var(--lm-border); border-radius:12px; padding:12px 16px; cursor:pointer; transition:background .15s, border-color .15s; }
  .opt:hover{ border-color:var(--lm-blue); }
  .opt input{ accent-color:var(--lm-blue-deep); width:18px; height:18px; flex:0 0 auto; }
  .opt.right{ background:var(--ok-soft); border-color:var(--ok); }
  .opt.wrong{ background:var(--bad-soft); border-color:var(--bad); }
  .fb{ margin-top:10px; font-weight:600; min-height:1.2em; }
  .fb.right{ color:var(--ok); } .fb.wrong{ color:var(--bad); }
  .hint{ font-size:15px; color:var(--lm-muted); margin-top:6px; }
  .send{ display:block; width:100%; font:800 22px 'Assistant',sans-serif; padding:16px; border:0; border-radius:14px; cursor:pointer;
    background:var(--lm-orange); color:var(--lm-ink); box-shadow:0 8px 20px rgba(250,117,72,.3); }
  .send:disabled{ opacity:.6; cursor:wait; }
  .status{ text-align:center; margin-top:14px; font-weight:700; min-height:1.4em; }
  .status.err{ color:var(--bad); }
  .done{ text-align:center; }
  .done h2{ font-size:30px; color:var(--lm-ink); }
  .done .score{ display:inline-block; background:var(--lm-teal-soft); color:var(--lm-blue-deep); font-weight:800; font-size:22px; border-radius:999px; padding:8px 22px; margin:6px 0 14px; }
  @media (max-width:560px){ .hero h1{ font-size:32px; } .card{ padding:20px 18px; } }
</style>
</head>
<body>

<header class="hero">
  <small>דף חזרה · מדעים</small>
  <h1>מערכת <span class="mark">השמש</span></h1>
  <p>חזרה קצרה לפני המבחן. ענו על השאלות, ובסוף שלחו את התשובות למורה.</p>
</header>

<main>
  <form id="sheet" autocomplete="off" novalidate>
    <section class="card">
      <h2>פרטים</h2>
      <label><span class="f">שם</span><input type="text" id="name" required></label>
    </section>

    <div id="qs"></div>

    <button type="submit" class="send" id="send">הגשה</button>
    <div class="status" id="status"></div>
  </form>

  <section class="card done" id="done" hidden>
    <h2>תודה, התשובות נשלחו!</h2>
    <div class="score" id="score"></div>
    <p>המורה רואה את התשובות שלכם בגיליון.</p>
  </section>
</main>

<script>
  /* ===== הגדרות =====
     SCRIPT_URL: כתובת ה-Web App של הסקריפט "דף-חזרה.gs". התשובות נכתבות לגיליון */
  var SCRIPT_URL = "";

  // פנייה לסקריפט (JSONP: עובד מכל אתר, גם מוויקס)
  function callScript(params, done){
    var cb = "lomdaCb" + Date.now() + Math.floor(Math.random() * 1000), s = document.createElement("script");
    var timer = setTimeout(function(){ finish({ ok:false, msg:"אין תשובה מהגיליון. נסו שוב בעוד רגע" }); }, 15000);
    function finish(res){ clearTimeout(timer); window[cb] = function(){}; if (s.parentNode) s.parentNode.removeChild(s); done(res || { ok:false }); }
    window[cb] = finish;
    s.src = SCRIPT_URL + "?" + Object.keys(params).map(function(k){ return k + "=" + encodeURIComponent(params[k]); }).join("&") + "&callback=" + cb;
    s.onerror = function(){ finish({ ok:false, msg:"לא הצלחנו להגיע לגיליון" }); };
    document.body.appendChild(s);
  }

  /* השאלות. open: true = שאלה פתוחה. right = מספר התשובה הנכונה, מתחילים מ-0 */
  var QUESTIONS = [
    { q: "איזה כוכב לכת הכי קרוב לשמש?",
      opts: ["כוכב חמה", "נוגה", "כדור הארץ", "מאדים"],
      right: 0, yes: "נכון! כוכב חמה הוא הקרוב ביותר לשמש.",
      no: "עוד לא. חשבו על הכוכב הקטן והחם, הראשון בשורה." },
    { q: "מהו כוכב הלכת הגדול ביותר במערכת השמש?",
      opts: ["שבתאי", "צדק", "אורנוס", "נפטון"],
      right: 1, yes: "נכון! צדק כל כך גדול, שכל שאר כוכבי הלכת היו נכנסים בתוכו.",
      no: "נסו שוב: הוא גדול אפילו משבתאי, בעל הטבעות." },
    { q: "למה יש על כדור הארץ יום ולילה?",
      opts: ["כי כדור הארץ מסתובב סביב עצמו", "כי השמש מסתובבת סביב כדור הארץ",
             "כי הירח מסתיר את השמש", "בגלל העננים"],
      right: 0, yes: "נכון! סיבוב אחד סביב עצמו לוקח כ-24 שעות.",
      no: "עוד לא. מי זז כאן, השמש או אנחנו?" },
    { q: "כמה זמן לוקח לכדור הארץ להקיף את השמש?",
      opts: ["יום", "חודש", "שנה", "עשר שנים"],
      right: 2, yes: "נכון! הקפה אחת סביב השמש היא שנה, כ-365 ימים.",
      no: "נסו שוב: חשבו כמה זמן עובר מיום הולדת אחד לבא." },
    { q: "מה ההבדל בין כוכב, כמו השמש, לבין כוכב לכת?", open: true },
    { q: "אם הייתם יכולים לבקר בכוכב לכת אחד, איזה הייתם בוחרים, ולמה?", open: true }
  ];

  function showQuestions(){
    var box = document.getElementById("qs");
    QUESTIONS.forEach(function(item, i){
      var sec = document.createElement("section");
      sec.className = "card";
      sec.innerHTML = '<div class="num">שאלה ' + (i + 1) + '</div><div class="q"></div>';
      sec.querySelector(".q").textContent = item.q;
      if (item.open){
        var ta = document.createElement("textarea"); ta.id = "a" + i;
        sec.appendChild(ta);
      } else {
        var opts = document.createElement("div"); opts.className = "opts";
        var fb = document.createElement("div"); fb.className = "fb";
        item.opts.forEach(function(text, k){
          var lab = document.createElement("label");
          lab.className = "opt";
          lab.innerHTML = '<input type="radio" name="a' + i + '" value="' + k + '"><span></span>';
          lab.querySelector("span").textContent = text;
          lab.querySelector("input").addEventListener("change", function(){
            if (item.right < 0) return;
            [].forEach.call(opts.children, function(o){ o.classList.remove("right", "wrong"); });
            var good = k === item.right;
            lab.classList.add(good ? "right" : "wrong");
            fb.className = "fb " + (good ? "right" : "wrong");
            fb.textContent = good ? item.yes : item.no;
          });
          opts.appendChild(lab);
        });
        sec.appendChild(opts); sec.appendChild(fb);
      }
      box.appendChild(sec);
    });
  }

  showQuestions();

  document.getElementById("sheet").addEventListener("submit", function(e){
    e.preventDefault();
    var status = document.getElementById("status"), btn = document.getElementById("send");
    status.className = "status"; status.textContent = "";
    var name = document.getElementById("name").value.trim();
    if (!name){ status.className = "status err"; status.textContent = "כתבו את השם שלכם"; document.getElementById("name").focus(); return; }

    var correct = 0, graded = 0, answers = [];
    QUESTIONS.forEach(function(item, i){
      var a = "";
      if (item.open) a = document.getElementById("a" + i).value.trim();
      else {
        var el = document.querySelector('input[name="a' + i + '"]:checked');
        if (el) a = item.opts[+el.value];
        if (item.right >= 0){ graded++; if (el && +el.value === item.right) correct++; }
      }
      answers.push({ q: item.q, a: a });
    });
    var score = graded ? correct + " מתוך " + graded : "";
    if (!SCRIPT_URL){ status.className = "status err"; status.textContent = "הלומדה עוד לא מחוברת לגיליון"; return; }
    var data = { name: name, answers: answers };

    btn.disabled = true; status.textContent = "שולחים...";
    callScript({ action:"send", data: JSON.stringify(data) }, function(res){
      btn.disabled = false;
      if (!res.ok){ status.className = "status err"; status.textContent = res.msg || "משהו השתבש"; return; }
      document.getElementById("sheet").hidden = true;
      document.getElementById("score").textContent = score ? "צדקתם ב-" + score : "";
      document.getElementById("score").hidden = !score;
      document.getElementById("done").hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
</script>
</body>
</html>
